# Generated by node scripts/generate-portal-api-policy.cjs. Do not edit.
# Include once at nginx http{} scope. Route filtering supplements backend authorization.
map "$request_method:$uri" $viara_portal_api_allowed {
    default 0;
    "~^(?:GET|HEAD):/api/csrf-token/?$" 1;
    "~^(?:GET|HEAD):/api/profile/?$" 1;
    "~^(?:GET|HEAD):/api/exam-types/?$" 1;
    "~^(?:GET|HEAD):/api/settings/(?:public/home|center)/?$" 1;
    "~^(?:POST):/api/(?:portal|doctor-portal)/login/?$" 1;
    "~^(?:POST):/api/portal/auth/(?:refresh|logout)/?$" 1;
    "~^(?:POST):/api/auth/(?:logout|change-password)/?$" 1;
    "~^(?:GET|HEAD):/api/portal/(?:records|profile|invoices|documents|appointment-requests)/?$" 1;
    "~^(?:POST):/api/portal/(?:appointment-requests|profile-update-requests)/?$" 1;
    "~^(?:GET|HEAD):/api/portal/documents/[A-Za-z0-9_-]+/download/?$" 1;
    "~^(?:GET|HEAD|POST):/api/(?:portal|doctor-portal)/messages/?$" 1;
    "~^(?:GET|HEAD):/api/doctor-portal/messages/unread-count/?$" 1;
    "~^(?:GET|HEAD):/api/(?:portal|doctor-portal)/notifications(?:/unread-count)?/?$" 1;
    "~^(?:PUT):/api/(?:portal|doctor-portal)/notifications/(?:mark-all-read|[A-Za-z0-9_-]+/read)/?$" 1;
    "~^(?:POST):/api/doctor-portal/notifications/[A-Za-z0-9_-]+/critical-result/acknowledge/?$" 1;
    "~^(?:GET|HEAD):/api/doctor-portal/cases/?$" 1;
    "~^(?:GET|HEAD):/api/doctor-portal/reports/[A-Za-z0-9_-]+(?:/pdf)?/?$" 1;
    "~^(?:POST):/api/doctor-portal/orders/?$" 1;
    "~^(?:GET|HEAD):/api/exams/[A-Za-z0-9_-]+/report/pdf/?$" 1;
    "~^(?:GET|HEAD):/api/portal/invoices/[A-Za-z0-9_-]+/pdf/?$" 1;
    "~^(?:POST):/api/realtime/session/?$" 1;
    "~^(?:GET):/api/realtime/stream/?$" 1;
    "~^(?:GET|HEAD):/api/public/landing-overview/?$" 1;
    "~^(?:POST):/api/public/(?:case-status(?:/verify|/status)?|appointment-requests|final-report)/?$" 1;
    "~^(?:GET|HEAD):/api/public/final-report/[A-Za-z0-9_.~-]+/?$" 1;
    "~^(?:GET|HEAD):/api/public/reports/verify/[A-Za-z0-9_-]+/?$" 1;
}

# Do not log query strings, Authorization, referrers, or legacy report-link tokens.
map $uri $viara_portal_log_path {
    default $uri;
    ~^/api/public/final-report/ /api/public/final-report/[redacted];
}
log_format viara_portal '$remote_addr [$time_local] "$request_method $viara_portal_log_path" $status $body_bytes_sent $request_time';
