<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E7C7B" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="Patient and referring-doctor portals for secure access to radiology reports, appointments, and documents."
    />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph fallbacks; the portal replaces these with configured center data at runtime. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VIARA" />
    <meta property="og:title" content="VIARA Portals - Patient & Doctor Access" />
    <meta
      property="og:description"
      content="Patient and referring-doctor portals for secure access to radiology reports, appointments, and documents."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: Manrope (UI) + Noto Sans Arabic (Arabic/RTL). Kept in sync with tailwind.config.js. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>VIARA Portals - Patient & Doctor Access</title>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
