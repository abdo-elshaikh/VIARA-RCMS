<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" role="img" aria-labelledby="title desc">
  <title id="title">Secure digital radiology results</title>
  <desc id="desc">A chest radiograph and report on a laptop beside a protected mobile report and imaging disc.</desc>
  <defs>
    <linearGradient id="laptop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#afd9df"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefbfe"/><stop offset="1" stop-color="#b4dce6"/></linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#c5e9e8"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8ffff"/><stop offset=".55" stop-color="#c7e5e6"/><stop offset="1" stop-color="#7db8bd"/></linearGradient>
    <linearGradient id="secure" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38d5a1"/><stop offset="1" stop-color="#079d92"/></linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="180%" height="210%"><feDropShadow dx="0" dy="11" stdDeviation="8" flood-color="#155e66" flood-opacity=".2"/></filter>
    <filter id="soft" x="-30%" y="-40%" width="180%" height="210%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#0f766e" flood-opacity=".17"/></filter>
  </defs>

