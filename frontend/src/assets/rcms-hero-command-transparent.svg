<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Radiology command station</title>
  <desc id="desc">An isometric CT scanner connected to floating radiology workflow and analytics panels.</desc>
  <defs>
    <linearGradient id="machine" x1=".08" y1=".05" x2=".92" y2=".95">
      <stop stop-color="#ffffff"/><stop offset=".48" stop-color="#e8f7f4"/><stop offset="1" stop-color="#9bc9c4"/>
    </linearGradient>
    <linearGradient id="machineSide" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#72aaa8"/><stop offset=".55" stop-color="#cce7e3"/><stop offset="1" stop-color="#f8ffff"/>
    </linearGradient>
    <linearGradient id="ring" x1=".12" y1=".08" x2=".9" y2=".92">
      <stop stop-color="#ffffff"/><stop offset=".46" stop-color="#d5eeeb"/><stop offset="1" stop-color="#65aaa6"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#faffff"/><stop offset=".55" stop-color="#c5e7e3"/><stop offset="1" stop-color="#62aaa5"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".98"/><stop offset="1" stop-color="#dff7f2" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#37dda8"/><stop offset=".55" stop-color="#0cad88"/><stop offset="1" stop-color="#087e75"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#55cbe1"/><stop offset="1" stop-color="#167ca2"/>
    </linearGradient>
    <radialGradient id="bore" cx="45%" cy="42%">
      <stop stop-color="#dff8f5"/><stop offset=".56" stop-color="#8fc8c4"/><stop offset="1" stop-color="#487f80"/>
    </radialGradient>
    <radialGradient id="boreLight" cx="48%" cy="44%">
      <stop stop-color="#f6fffe" stop-opacity=".98"/><stop offset=".42" stop-color="#7ce2d0" stop-opacity=".7"/><stop offset="1" stop-color="#2b9e99" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0a827b"/><stop offset=".5" stop-color="#49cdbb"/><stop offset="1" stop-color="#0a827b"/>
    </linearGradient>
    <pattern id="microGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#5ebdb4" stroke-width=".7" opacity=".22"/>
    </pattern>
    <filter id="objectShadow" x="-30%" y="-30%" width="170%" height="190%">
      <feDropShadow dx="0" dy="24" stdDeviation="17" flood-color="#105f5c" flood-opacity=".24"/>
    </filter>
    <filter id="panelShadow" x="-40%" y="-50%" width="190%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0b5f61" flood-opacity=".2"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

