<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
  <title id="title">Connected radiology scanner</title>
  <desc id="desc">A detailed CT scanner and patient table linked to floating secure workflow cards.</desc>
  <defs>
    <linearGradient id="shell" x1=".08" y1=".05" x2=".9" y2=".94">
      <stop stop-color="#ffffff"/><stop offset=".48" stop-color="#e9f7f6"/><stop offset="1" stop-color="#a8d5d1"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#83bdbb"/><stop offset=".46" stop-color="#cde8e5"/><stop offset="1" stop-color="#f8ffff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#faffff"/><stop offset=".5" stop-color="#b7dedb"/><stop offset="1" stop-color="#77b5b1"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8ffff"/><stop offset=".52" stop-color="#bce3df"/><stop offset="1" stop-color="#68b5ae"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".98"/><stop offset="1" stop-color="#dff7f3" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#28d39d"/><stop offset="1" stop-color="#079b91"/>
    </linearGradient>
    <radialGradient id="wash">
      <stop stop-color="#7be2ce" stop-opacity=".42"/><stop offset=".62" stop-color="#b9eee4" stop-opacity=".16"/><stop offset="1" stop-color="#c7f3eb" stop-opacity="0"/>
    </radialGradient>
    <filter id="machineShadow" x="-35%" y="-30%" width="180%" height="190%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#176d68" flood-opacity=".2"/>
    </filter>
    <filter id="floatShadow" x="-35%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#14766d" flood-opacity=".2"/>
    </filter>
  </defs>

  <ellipse cx="270" cy="242" rx="284" ry="212" fill="url(#wash)"/>
  <ellipse cx="257" cy="419" rx="217" ry="19" fill="#16766f" opacity=".1"/>

  <g filter="url(#machineShadow)">
    <path d="M42 186C42 88 109 24 204 24h48c101 0 168 68 168 169v157H42z" fill="url(#side)"/>
    <path d="M81 345V185c0-80 58-137 137-137h28c85 0 145 62 145 149v148z" fill="url(#shell)" stroke="#c4e5e1" stroke-width="4"/>
    <path d="M103 134c36-55 97-78 164-66" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    <path d="M337 88c30 37 40 77 34 121" fill="none" stroke="#9bc9c6" stroke-width="4" stroke-linecap="round" opacity=".55"/>

    <ellipse cx="231" cy="219" rx="103" ry="125" fill="url(#rim)" stroke="#f8ffff" stroke-width="13"/>
    <ellipse cx="231" cy="219" rx="76" ry="94" fill="#eaf7f5" stroke="#83c9c3" stroke-width="7"/>
    <ellipse cx="231" cy="219" rx="60" ry="75" fill="#a2cfcc"/>
    <ellipse cx="231" cy="219" rx="50" ry="64" fill="#8dc0bd" opacity=".54"/>
    <path d="M169 148c17-20 39-30 65-30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".88"/>

    <circle cx="105" cy="247" r="8" fill="#12bd82"/>
    <circle cx="105" cy="272" r="4" fill="#4fcbd0"/>
    <rect x="92" y="294" width="42" height="12" rx="3" fill="#8ec9c4"/>
    <rect x="308" y="101" width="41" height="13" rx="3" fill="#d2e9e7"/>
    <circle cx="330" cy="107.5" r="4" fill="#16b884"/>

    <path d="M63 328h328c19 0 34 14 34 33v15H63z" fill="#f9ffff" stroke="#a7d4d0" stroke-width="3"/>
    <path d="M86 310h283c18 0 34 14 39 34H74c0-14 4-26 12-34z" fill="url(#table)"/>
    <path d="M91 321c65-23 140-29 212-12 29 7 55 15 79 25" fill="none" stroke="#27b6aa" stroke-width="14" stroke-linecap="round"/>
    <path d="M78 354h330" fill="none" stroke="#0b8e86" stroke-width="5" stroke-linecap="square" opacity=".7"/>
    <path d="M176 376h150l-15 43H191z" fill="#9ccbc7"/>
    <path d="M163 419h175" stroke="#72aaa7" stroke-width="12" stroke-linecap="square"/>
  </g>

  <g filter="url(#floatShadow)" transform="translate(388 53) rotate(-4 94 45)">
    <rect width="188" height="90" rx="10" fill="url(#glass)" stroke="#b7e7df" stroke-width="2"/>
    <rect x="17" y="17" width="50" height="54" rx="8" fill="#d9f7ef"/>
    <circle cx="42" cy="44" r="16" fill="url(#teal)"/>
    <path d="m34 44 6 6 11-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="82" y="20" width="72" height="8" rx="2" fill="#7cd3ca"/>
    <rect x="82" y="38" width="57" height="7" rx="2" fill="#c9e6e2"/>
    <rect x="82" y="55" width="68" height="7" rx="2" fill="#c9e6e2"/>
    <path d="M166 17v23" stroke="#14b982" stroke-width="6" stroke-linecap="square"/>
    <circle cx="166" cy="13" r="5" fill="#14b982"/>
  </g>

  <g filter="url(#floatShadow)" transform="translate(424 174) rotate(3 76 38)">
    <rect width="154" height="75" rx="9" fill="url(#glass)" stroke="#bee8e2" stroke-width="2"/>
    <circle cx="31" cy="37" r="16" fill="url(#teal)"/>
    <path d="m23 37 6 6 11-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="61" y="24" width="7" height="27" rx="2" fill="#84d8cf"/>
    <rect x="74" y="32" width="7" height="19" rx="2" fill="#12b982"/>
    <rect x="87" y="17" width="7" height="34" rx="2" fill="#4ccbbe"/>
    <path d="M106 44c8-20 18-20 28 0" fill="none" stroke="#0da7a0" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="#77dccc" stroke-width="2" opacity=".8">
    <path d="M592 279h20M602 269v20"/><path d="M472 19h19"/>
  </g>
  <g fill="#17ba87"><circle cx="578" cy="305" r="4"/><circle cx="516" cy="334" r="3"/></g>
</svg>
