services:
  # Database Service
  postgres:
    image: postgres:15-alpine
    container_name: VIARA_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-VIARA}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:-VIARA}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [data, app]
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 60s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/00_create_orthanc_db.sql:/docker-entrypoint-initdb.d/00_create_orthanc_db.sql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    restart: "no"
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-VIARA}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-VIARA}
    volumes:
      - ./database:/database:ro
    networks: [data]
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: VIARA_redis
    restart: unless-stopped
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env file}
    networks: [app, data]
    mem_limit: 512m
    cpus: 0.5
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  clamav:
    image: clamav/clamav:stable
    container_name: VIARA_clamav
    restart: unless-stopped
    networks: [data, scanner-egress]
    volumes:
      - clamav_signatures:/var/lib/clamav
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=5"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # Backend API
  backend:
    build: ./backend
    image: viara-backend:local
    container_name: VIARA_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-3000}:3000"
    networks: [app, data, redis]
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 45s
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      LICENSE_KEY: ${LICENSE_KEY:-}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      LICENSE_STORAGE_FILE: /app/license/license.key
      LICENSE_ACTIVATION_FILE: /app/license/activation
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-VIARA}
      PACS_OIDC_ISSUER: ${PACS_OIDC_ISSUER:-}
      PACS_OIDC_AUDIENCE: ${PACS_OIDC_AUDIENCE:-}
      PACS_OIDC_JWKS_URL: ${PACS_OIDC_JWKS_URL:-}
      PACS_OIDC_USER_ID_CLAIM: ${PACS_OIDC_USER_ID_CLAIM:-viara_user_id}
      PACS_OIDC_REQUIRED_SCOPE: ${PACS_OIDC_REQUIRED_SCOPE:-pacs.read}
      PACS_OIDC_MAX_TOKEN_TTL_SECONDS: ${PACS_OIDC_MAX_TOKEN_TTL_SECONDS:-300}
      DATABASE_URL: postgresql://${POSTGRES_USER:-VIARA}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-VIARA}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in the root .env file}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Set BACKUP_ENCRYPTION_KEY in the root .env file}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?Set BLIND_INDEX_KEY in the root .env file}
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL to the public HTTPS staff application URL}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      PORTAL_CLIENT_URL: ${PORTAL_CLIENT_URL:?Set PORTAL_CLIENT_URL to the public HTTPS portal URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to the exact public HTTPS origins}
      CLAMSCAN_PATH: /usr/bin/clamdscan
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      MALWARE_SCAN_TIMEOUT_MS: ${MALWARE_SCAN_TIMEOUT_MS:-30000}
      BACKUP_MODE: postgres
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: 30
      BACKUP_MAX_FILES: 30
      BACKUP_SCHEDULE_ENABLED: "true"
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      BACKUP_SCHEDULE_HOUR_UTC: 2
      BACKUP_OFFSITE_ENDPOINT: ${BACKUP_OFFSITE_ENDPOINT:-}
      BACKUP_OFFSITE_BUCKET: ${BACKUP_OFFSITE_BUCKET:-}
      BACKUP_OFFSITE_REGION: ${BACKUP_OFFSITE_REGION:-us-east-1}
      BACKUP_OFFSITE_PREFIX: ${BACKUP_OFFSITE_PREFIX:-}
      BACKUP_OFFSITE_ACCESS_KEY: ${BACKUP_OFFSITE_ACCESS_KEY:-}
      BACKUP_OFFSITE_SECRET_KEY: ${BACKUP_OFFSITE_SECRET_KEY:-}
      # PACS / Orthanc integration
      ORTHANC_URL: ${ORTHANC_URL:-http://orthanc:8042}
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-VIARA}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD in the root .env file}
      ORTHANC_AET: ${ORTHANC_AET:-MiPACS2}
      PACS_WEBHOOK_SECRET: ${PACS_WEBHOOK_SECRET:?Set PACS_WEBHOOK_SECRET in the root .env file}
      PACS_WORKLIST_DIR: /app/pacs-worklists
      PACS_COLD_STORAGE_DIR: /app/pacs-cold
      PACS_BACKUP_ENABLED: "true"
      PACS_TIMEZONE: ${PACS_TIMEZONE:-Africa/Cairo}
      PACS_MWL_ENABLED: ${PACS_MWL_ENABLED:-true}
      # Optional asynchronous PACS image-analysis worker
      PACS_AI_ENABLED: ${PACS_AI_ENABLED:-false}
      PACS_AI_PROVIDER: ${PACS_AI_PROVIDER:-local-torchxrayvision}
      PACS_AI_MODEL: ${PACS_AI_MODEL:-densenet121-res224-all}
      PACS_AI_MODEL_VERSION: ${PACS_AI_MODEL_REVISION:-}
      PACS_AI_WORKER_URL: ${PACS_AI_WORKER_URL:-}
      PACS_AI_API_KEY: ${PACS_AI_WORKER_API_KEY:-}
      PACS_AI_WORKER_TIMEOUT_MS: ${PACS_AI_WORKER_TIMEOUT_MS:-600000}
      PACS_AI_QUEUE_INTERVAL_MS: ${PACS_AI_QUEUE_INTERVAL_MS:-30000}
      PACS_AI_QUEUE_BATCH_SIZE: ${PACS_AI_QUEUE_BATCH_SIZE:-1}
      RATE_LIMIT_STORE: redis
      PACS_AI_RELEASE_APPROVED: ${PACS_AI_RELEASE_APPROVED:-false}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      # Host source mount moved to docker-compose.override.yml for development only
      # - ./backend/src:/app/src
      - backup_data:/app/backups
      - pacs_cold_archive:/app/pacs-cold
      - upload_data:/app/uploads
      - license_data:/app/license
      - ./pacs-worklists:/app/pacs-worklists
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # Local-only identity provider for OIDC integration testing. Not for production.
  keycloak:
    profiles: ["oidc-dev"]
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.3.3}
    container_name: VIARA_keycloak_dev
    restart: unless-stopped
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_DEV_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_DEV_ADMIN_PASSWORD:-}
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    networks: [app]
    mem_limit: 1536m
    cpus: 2.0
    stop_grace_period: 30s
    volumes:
      - keycloak_dev_data:/opt/keycloak/data

  # Frontend App
  # VITE_OHIF_URL is baked in at build time by Vite (ARG → ENV in the Dockerfile).
  frontend:
    build:
      context: ./frontend
      args:
        VITE_OHIF_URL: "${VITE_OHIF_URL:-/pacs-viewer/}"
        VITE_PORTAL_PUBLIC_URL: "${PORTAL_PUBLIC_URL:?Set PORTAL_PUBLIC_URL to the public HTTPS portal URL}"
    image: viara-frontend:local
    container_name: VIARA_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    networks: [app]
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Public Patient & Referring Doctor Portal
  portal:
    build:
      context: ./portal
      args:
        VITE_API_URL: "/api"
    image: viara-portal:local
    container_name: VIARA_portal
    restart: unless-stopped
    ports:
      - "${PORTAL_BIND:-127.0.0.1}:${PORTAL_PORT:-5174}:80"
    networks: [app]
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PACS DICOM Core (Orthanc)
  orthanc:
    image: orthancteam/orthanc:24.3.5
    container_name: VIARA_orthanc
    restart: unless-stopped
    ports:
      # DICOM must be reachable from modalities on the LAN/VPN for C-ECHO, C-STORE, and MWL.
      # Keep REST loopback-only; set PACS_DICOM_BIND=127.0.0.1 for workstation-only development.
      - "${PACS_DICOM_BIND:-127.0.0.1}:${PACS_DICOM_PORT:-4242}:4242"
      - "${ORTHANC_REST_BIND:-127.0.0.1}:${ORTHANC_REST_PORT:-8042}:8042"
    networks: [app, data]
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 60s
    environment:
      # Inject secrets into orthanc.json via Orthanc's env-var override mechanism.
      ORTHANC__POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USERNAME:-VIARA}":"${ORTHANC_PASSWORD}"}'
      VIARA_ORTHANC_USERNAME: ${ORTHANC_USERNAME:-VIARA}
      VIARA_ORTHANC_PASSWORD: ${ORTHANC_PASSWORD}
      # Consumed by reconcile.lua.
      VIARA_WEBHOOK_URL: http://backend:3000/api/pacs/webhook
      PACS_WEBHOOK_SECRET: ${PACS_WEBHOOK_SECRET}
      GDCM_PLUGIN_ENABLED: "true"
      ORTHANC__GDCM__ENABLE: "true"
    volumes:
      - ./pacs/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./pacs/orthanc/reconcile.lua:/etc/orthanc/reconcile.lua:ro
      - orthanc_storage:/var/lib/orthanc/db
      - ./pacs-worklists:/var/lib/orthanc/worklists
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import base64, os, urllib.request; credentials = f'{os.environ[\"VIARA_ORTHANC_USERNAME\"]}:{os.environ[\"VIARA_ORTHANC_PASSWORD\"]}'; request = urllib.request.Request('http://127.0.0.1:8042/system', headers={'Authorization': 'Basic ' + base64.b64encode(credentials.encode()).decode()}); urllib.request.urlopen(request, timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # OHIF Diagnostic Viewer
  # Serves the OHIF SPA and reverse-proxies /api/ to the backend so the viewer's
  # DICOMweb requests (QIDO/WADO/frames) are same-origin to :3005. OHIF handles
  # the short-lived, study-scoped bearer token for every DICOMweb request.
  ohif:
    build:
      context: ./pacs/ohif
    image: viara-ohif:v3.12.6
    container_name: VIARA_ohif
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OHIF_PORT:-3005}:80"
    networks: [app]
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VIARA_API_UPSTREAM: backend:3000
      VIARA_APP_ORIGIN: ${CLIENT_URL:-http://localhost:5173}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional local GPU inference service. It is excluded from normal startup;
  # launch it with: docker compose --profile ai up -d --build pacs-ai-worker
  pacs-ai-worker:
    profiles: ["ai"]
    build:
      context: ./pacs/ai-worker
      dockerfile: ${PACS_AI_DOCKERFILE:-Dockerfile}
    image: viara-pacs-ai-worker:1.0
    container_name: VIARA_pacs_ai_worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PACS_AI_WORKER_PORT:-3015}:8000"
    networks: [data]
    mem_limit: ${PACS_AI_MEMORY_LIMIT:-4g}
    cpus: ${PACS_AI_CPU_LIMIT:-2.0}
    stop_grace_period: 45s
    environment:
      PACS_AI_WORKER_API_KEY: ${PACS_AI_WORKER_API_KEY:-}
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-VIARA}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD}
      MODEL_BACKEND: ${PACS_AI_MODEL_BACKEND:-torchxrayvision}
      MODEL_ID: ${PACS_AI_MODEL_ID:-densenet121-res224-all}
      MODEL_REVISION: ${PACS_AI_MODEL_REVISION:-}
      HF_TOKEN: ${HF_TOKEN:-}
      PRELOAD_MODEL: ${PACS_AI_PRELOAD_MODEL:-false}
      ALLOW_CPU_INFERENCE: ${PACS_AI_ALLOW_CPU_INFERENCE:-true}
      INFERENCE_CONCURRENCY: ${PACS_AI_INFERENCE_CONCURRENCY:-1}
      MAX_CXR_VIEWS: ${PACS_AI_MAX_CXR_VIEWS:-2}
      XRV_WEIGHTS: ${PACS_AI_XRV_WEIGHTS:-densenet121-res224-all}
      XRV_FINDING_THRESHOLD: ${PACS_AI_XRV_FINDING_THRESHOLD:-0.65}
    volumes:
      - ai_model_cache:/models
    shm_size: "1gb"
    depends_on:
      orthanc:
        condition: service_started
    healthcheck:
      # Unauthenticated liveness on the internal network: avoids leaking
      # PACS_AI_WORKER_API_KEY to anyone who can run `docker inspect`.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: VIARA_prometheus
    restart: unless-stopped
    # Write $METRICS_TOKEN to a file so prometheus.yml can reference it via
    # authorization.credentials_file without embedding the secret in the config.
    entrypoint: >
      sh -c "
        mkdir -p /run/secrets &&
        printf '%s' \"$$METRICS_TOKEN\" > /run/secrets/metrics_token &&
        chmod 600 /run/secrets/metrics_token &&
        exec /bin/prometheus
          --config.file=/etc/prometheus/prometheus.yml
          --storage.tsdb.path=/prometheus
          --storage.tsdb.retention.time=30d
          --web.enable-lifecycle
      "
    networks: [monitoring, app]
    mem_limit: 512m
    cpus: 0.5
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana:11.1.0
    container_name: VIARA_grafana
    restart: unless-stopped
    networks: [monitoring]
    mem_limit: 512m
    cpus: 0.5
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the root .env file}
      GF_SECURITY_SECRET_KEY: ${GF_SECURITY_SECRET_KEY:?Set GF_SECURITY_SECRET_KEY in the root .env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3010}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3010}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  license_data:
  postgres_data:
  keycloak_dev_data:
  backup_data:
  upload_data:
  orthanc_storage:
  pacs_cold_archive:
  ai_model_cache:
  clamav_signatures:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  app:
  data:
    internal: true
  scanner-egress:
  redis:
  monitoring:
    internal: true
