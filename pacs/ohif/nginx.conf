# nginx config for the VIARA OHIF viewer container (ohif/app image).
#
# Baked into the OHIF image as its nginx template. It serves the OHIF SPA and
# reverse-proxies /api/ to the VIARA backend service, keeping DICOMweb requests
# on the viewer's browser origin.
#
# The viewer is embedded from the staff application's same HTTPS origin via
# the /pacs-viewer/ reverse-proxy path. X-Frame-Options is omitted because it
# would block the embed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    gzip_static on;
    resolver 127.0.0.11 ipv6=off valid=30s;

    add_header Content-Security-Policy "frame-ancestors 'self' ${VIARA_APP_ORIGIN}" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /app-config.js {
        gzip_static on;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /app-config.js =404;
    }

    # Keep DICOMweb same-origin to OHIF while routing to the backend service on
    # the shared compose network.
    location /api/ {
        set $VIARA_backend ${VIARA_API_UPSTREAM};
        proxy_pass http://$VIARA_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream large WADO frame responses instead of buffering them in nginx.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health/ready {
        set $VIARA_backend ${VIARA_API_UPSTREAM};
        proxy_pass http://$VIARA_backend/health/ready;
    }
}
