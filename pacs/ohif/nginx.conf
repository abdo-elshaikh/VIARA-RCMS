# nginx config for the RCMS OHIF viewer container (ohif/app image).
#
# Baked into the OHIF image as its nginx template. It serves the OHIF SPA and
# reverse-proxies /api/ to the RCMS backend on the Docker host, keeping the
# viewer's DICOMweb calls same-origin to http://localhost:3005.
#
# The viewer is embedded in an <iframe> by the RCMS SPA on :5173 (or :80 in
# docker-compose), so frame-ancestors permits those origins. X-Frame-Options is
# deliberately omitted because it would block the embed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    gzip_static always;
    resolver 127.0.0.11 ipv6=off valid=30s;

    add_header Content-Security-Policy "frame-ancestors http://localhost:5173 http://localhost:80" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /app-config.js {
        gzip_static always;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /app-config.js =404;
    }

    # Docker Desktop advertises an IPv6 host address that is not reachable from
    # this network, so the dynamic resolver is explicitly limited to IPv4.
    location /api/ {
        set $rcms_backend host.docker.internal:3000;
        proxy_pass http://$rcms_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream large WADO frame responses instead of buffering them in nginx.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
