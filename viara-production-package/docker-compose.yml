# =============================================================================
# VIARA RCMS — Client Production & Trial Orchestration
# =============================================================================
# Architecture:
#   - PostgreSQL 15 (Single database server with dedicated orthanc catalog)
#   - ClamAV Antivirus daemon for medical scan/attachment sanitization
#   - Node.js Backend API (Production mode with ECDSA license validation)
#   - Nginx Web Frontend (Single Page App with API reverse proxy)
#   - Public Patient & Referring Doctor Portal
#   - Orthanc DICOM PACS Server (C-STORE, C-FIND, Modality Worklist)
#   - OHIF Diagnostic DICOM Viewer
# =============================================================================

services:
  # ── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to an approved pinned image reference}
    container_name: ${COMPOSE_PROJECT_NAME:-viara}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-viara}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [data, app]
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 60s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/00_create_orthanc_db.sql:/docker-entrypoint-initdb.d/00_create_orthanc_db.sql:ro
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Incremental Schema Migration Runner ───────────────────────────────────
  migrate:
    image: ${VIARA_BACKEND_IMAGE:?Set VIARA_BACKEND_IMAGE to an approved immutable image reference}
    restart: "no"
    command: ["npm", "run", "migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-viara}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-viara}
    volumes:
      - ./database:/database:ro
    networks: [data]
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy

  # ── ClamAV Antivirus Daemon ───────────────────────────────────────────────
  clamav:
    image: ${CLAMAV_IMAGE:?Set CLAMAV_IMAGE to an approved pinned image reference}
    container_name: ${COMPOSE_PROJECT_NAME:-viara}-clamav
    restart: unless-stopped
    networks: [data, scanner-egress]
    volumes:
      - clamav_signatures:/var/lib/clamav
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=5"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # ── Backend Application Server ────────────────────────────────────────────
  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE to an approved pinned image reference}
    restart: unless-stopped
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    networks: [data]
    volumes: [redis_data:/data]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${VIARA_BACKEND_IMAGE:?Set VIARA_BACKEND_IMAGE to an approved immutable image reference}
    container_name: ${COMPOSE_PROJECT_NAME:-viara}-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    networks: [app, data]
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 45s
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RATE_LIMIT_STORE: redis
      PACS_AI_ENABLED: ${PACS_AI_ENABLED:-false}
      PACS_AI_RELEASE_APPROVED: ${PACS_AI_RELEASE_APPROVED:-false}
      PORT: 3000
      NODE_ENV: production
      LICENSE_KEY: ${LICENSE_KEY:?A signed license key is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-viara}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-viara}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Set BACKUP_ENCRYPTION_KEY in .env}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?Set BLIND_INDEX_KEY in .env}
      LICENSE_STORAGE_FILE: /app/license/.viara-license
      LICENSE_ACTIVATION_FILE: /app/license/.viara-activation
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL to the approved HTTPS staff origin}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,172.28.0.10,172.28.0.11}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      PORTAL_CLIENT_URL: ${PORTAL_CLIENT_URL:?Set PORTAL_CLIENT_URL to the approved HTTPS portal origin}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to the approved browser origins}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?Set WEBAUTHN_ORIGIN to the approved HTTPS staff origin}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?Set WEBAUTHN_RP_ID to the staff origin hostname}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:?Set WEBAUTHN_RP_NAME to the customer-facing application name}
      PACS_OIDC_ISSUER: ${PACS_OIDC_ISSUER:-}
      PACS_OIDC_AUDIENCE: ${PACS_OIDC_AUDIENCE:-}
      PACS_OIDC_JWKS_URL: ${PACS_OIDC_JWKS_URL:-}
      PACS_OIDC_USER_ID_CLAIM: ${PACS_OIDC_USER_ID_CLAIM:-viara_user_id}
      PACS_OIDC_REQUIRED_SCOPE: ${PACS_OIDC_REQUIRED_SCOPE:-pacs.read}
      PACS_OIDC_MAX_TOKEN_TTL_SECONDS: ${PACS_OIDC_MAX_TOKEN_TTL_SECONDS:-300}
      CLAMSCAN_PATH: /usr/bin/clamdscan
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      BACKUP_MODE: postgres
      BACKUP_DIR: /app/backups
      BACKUP_SCHEDULE_ENABLED: "true"
      BACKUP_OFFSITE_ENDPOINT: ${BACKUP_OFFSITE_ENDPOINT:-}
      BACKUP_OFFSITE_BUCKET: ${BACKUP_OFFSITE_BUCKET:-}
      BACKUP_OFFSITE_REGION: ${BACKUP_OFFSITE_REGION:-us-east-1}
      BACKUP_OFFSITE_PREFIX: ${BACKUP_OFFSITE_PREFIX:-}
      BACKUP_OFFSITE_ACCESS_KEY: ${BACKUP_OFFSITE_ACCESS_KEY:-}
      BACKUP_OFFSITE_SECRET_KEY: ${BACKUP_OFFSITE_SECRET_KEY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env}
      PACS_COLD_STORAGE_DIR: /app/pacs-cold
      PACS_BACKUP_ENABLED: "true"
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-VIARA}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD in .env}
      ORTHANC_AET: ${ORTHANC_AET:-MiPACS2}
      PACS_WEBHOOK_SECRET: ${PACS_WEBHOOK_SECRET:?Set PACS_WEBHOOK_SECRET in .env}
      PACS_WORKLIST_DIR: /app/pacs-worklists
      PACS_MWL_ENABLED: "true"
    volumes:
      - backup_data:/app/backups
      - license_data:/app/license
      - upload_data:/app/uploads
      - pacs_cold_archive:/app/pacs-cold
      - ./pacs-worklists:/app/pacs-worklists
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      orthanc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── Frontend Web Console (Nginx) ──────────────────────────────────────────
  frontend:
    image: ${VIARA_FRONTEND_IMAGE:?Set VIARA_FRONTEND_IMAGE to an approved immutable image reference}
    container_name: ${COMPOSE_PROJECT_NAME:-viara}-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    networks:
      app:
        ipv4_address: 172.28.0.10
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Public Patient & Doctor Portal ────────────────────────────────────────
  portal:
    image: ${VIARA_PORTAL_IMAGE:?Set VIARA_PORTAL_IMAGE to an approved immutable image reference}
    container_name: ${COMPOSE_PROJECT_NAME:-viara}-portal
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTAL_PORT:-5174}:80"
    networks:
      app:
        ipv4_address: 172.28.0.11
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── PACS DICOM Core (Orthanc) ─────────────────────────────────────────────
  orthanc:
    image: ${ORTHANC_IMAGE:?Set ORTHANC_IMAGE to an approved pinned image reference}
    container_name: ${COMPOSE_PROJECT_NAME:-viara}-orthanc
    restart: unless-stopped
    ports:
      - "${PACS_DICOM_BIND:-127.0.0.1}:${PACS_DICOM_PORT:-4242}:4242"
      - "127.0.0.1:${ORTHANC_REST_PORT:-8042}:8042"
    networks: [app, data]
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 60s
    environment:
      ORTHANC__POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      ORTHANC__POSTGRESQL__USERNAME: ${POSTGRES_USER:-viara}
      ORTHANC__DICOM_AET: ${ORTHANC_AET:-MiPACS2}
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USERNAME:-VIARA}":"${ORTHANC_PASSWORD}"}'
      VIARA_ORTHANC_USERNAME: ${ORTHANC_USERNAME:-VIARA}
      VIARA_ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD in .env}
      VIARA_WEBHOOK_URL: http://backend:3000/api/pacs/webhook
      PACS_WEBHOOK_SECRET: ${PACS_WEBHOOK_SECRET:?Set PACS_WEBHOOK_SECRET in .env}
      GDCM_PLUGIN_ENABLED: "true"
      ORTHANC__GDCM__ENABLE: "true"
    volumes:
      - ./pacs/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./pacs/orthanc/reconcile.lua:/etc/orthanc/reconcile.lua:ro
      - orthanc_storage:/var/lib/orthanc/db
      - ./pacs-worklists:/var/lib/orthanc/worklists
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import base64, os, urllib.request; credentials = f'{os.environ[\"VIARA_ORTHANC_USERNAME\"]}:{os.environ[\"VIARA_ORTHANC_PASSWORD\"]}'; request = urllib.request.Request('http://127.0.0.1:8042/system', headers={'Authorization': 'Basic ' + base64.b64encode(credentials.encode()).decode()}); urllib.request.urlopen(request, timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── OHIF Diagnostic Viewer ────────────────────────────────────────────────
  ohif:
    image: ${VIARA_OHIF_IMAGE:?Set VIARA_OHIF_IMAGE to an approved immutable image reference}
    container_name: ${COMPOSE_PROJECT_NAME:-viara}-ohif
    restart: unless-stopped
    environment:
      VIARA_API_UPSTREAM: backend:3000
      VIARA_APP_ORIGIN: ${CLIENT_URL:?Set CLIENT_URL to the approved HTTPS staff origin}
    ports:
      - "127.0.0.1:${OHIF_PORT:-3005}:80"
    networks: [app]
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Prometheus Metrics Collector ─────────────────────────────────────────
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.53.0}
    container_name: ${COMPOSE_PROJECT_NAME:-viara}-prometheus
    restart: unless-stopped
    # Write $METRICS_TOKEN to a file so prometheus.yml can reference it via
    # authorization.credentials_file without embedding the secret in the config.
    entrypoint: >
      sh -c "
        mkdir -p /run/secrets &&
        printf '%s' \"$$METRICS_TOKEN\" > /run/secrets/metrics_token &&
        chmod 600 /run/secrets/metrics_token &&
        exec /bin/prometheus
          --config.file=/etc/prometheus/prometheus.yml
          --storage.tsdb.path=/prometheus
          --storage.tsdb.retention.time=30d
          --web.enable-lifecycle
      "
    networks: [monitoring, app]
    mem_limit: 512m
    cpus: 0.5
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Grafana Dashboard ─────────────────────────────────────────────────────
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.1.0}
    container_name: ${COMPOSE_PROJECT_NAME:-viara}-grafana
    restart: unless-stopped
    networks: [monitoring]
    mem_limit: 512m
    cpus: 0.5
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_SECRET_KEY: ${GF_SECURITY_SECRET_KEY:?Set GF_SECURITY_SECRET_KEY in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3010}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3010}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  redis_data:
  postgres_data:
  backup_data:
  license_data:
  upload_data:
  pacs_cold_archive:
  orthanc_storage:
  clamav_signatures:
  prometheus_data:
  grafana_data:

networks:
  app:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  data:
    internal: true
  scanner-egress:
  monitoring:
    internal: true
