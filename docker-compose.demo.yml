# VIARA — Demo stack overlay
#
# Purpose
# -------
# Lets a second, third, ... VIARA stack run on a host that already runs the main
# stack. The blocker is that `docker-compose.yml` pins `container_name` on its
# services. A fixed container name defeats Compose project namespacing:
# `docker compose -p viara-demo-acme up` still asks Docker for a container
# literally named `VIARA_db`, which collides with the running main stack.
#
# `!reset` (Compose v2.24+) removes those keys so containers fall back to the
# standard `<project>-<service>-<index>` naming and are namespaced by `-p`.
#
# The main `docker-compose.yml` is deliberately NOT modified. The one exception
# is `ORTHANC_REST_PORT`, which was made a variable there (default unchanged at
# 8042) so demo stacks can be given their own REST port.
#
# Usage
# -----
#   docker compose -p viara-demo-acme \
#     -f docker-compose.yml -f docker-compose.demo.yml \
#     --env-file .env.demo-acme up -d
#
# Never use this overlay for the production stack.
# See docs/adr-001-demo-isolation.md.

services:
  postgres:
    container_name: !reset null

  redis:
    container_name: !reset null

  clamav:
    container_name: !reset null

  backend:
    container_name: !reset null
    volumes:
      - demo_pacs_worklists:/app/pacs-worklists

  orthanc:
    container_name: !reset null
    environment:
      ORTHANC__POSTGRESQL__USERNAME: ${POSTGRES_USER:-postgres}
    volumes:
      - demo_pacs_worklists:/var/lib/orthanc/worklists

  frontend:
    container_name: !reset null
    build:
      args:
        VITE_DEMO_PASSWORD: ${TEST_USER_PASSWORD:?Set TEST_USER_PASSWORD in the demo env file}

  portal:
    container_name: !reset null

  ohif:
    container_name: !reset null

volumes:
  demo_pacs_worklists:

# `pacs_ai_worker` is deliberately NOT listed here. It is gated behind
# `profiles: ["ai"]` in the base file, and naming a profile-gated service in an
# override pulls it into the default (no-profile) set — where it has no build
# context in scope, and `docker compose config` fails with
#   "service \"pacs_ai_worker\" has neither an image nor a build context specified".
# Demo stacks do not need the optional AI worker. If one ever does, add
# `profiles: ["ai"]` alongside `container_name: !reset null` here.
