# VIARA Public Portal Edge (Tier A) — portal only, nothing clinical.
#
# Reachability: the internet, but ONLY through Cloudflare (WAF + Tunnel). This
# file must be combined with the Cloudflare connector or a firewall that allows
# traffic only from Cloudflare's published IP ranges. See
# cloudflare/tunnel-config.yml.example for the recommended tunnel approach
# (no inbound port open at all).
#
# Hard rules enforced here:
#   * /pacs-viewer/ and every admin/management path return 404
#   * only portal-scoped API access is proxied (read/request verbs)
#   * no DICOMweb, Orthanc, metrics, or database is reachable
#   * TLS 1.3 preferred, HSTS preload, strict CSP
#
# Upstream is the packaged portal service (host loopback :5174).

upstream viara_portal {
    server 127.0.0.1:5174;
    keepalive 16;
}

include /etc/nginx/portal-api-policy.conf;

upstream viara_portal_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Cloudflare real client IP. If you front this with Cloudflare, build the map in
# the main nginx.conf http{} block using the up-to-date list at
# https://www.cloudflare.com/ips/  and then restore_client_real_ip below.
# map $http_cf_connecting_ip $viara_real_ip { default $http_cf_connecting_ip; }
# real_ip_header CF-Connecting-IP;
# real_ip_recursive on;

server {
    # Loopback only: the Cloudflare connector (cloudflared) dials this.
    listen 127.0.0.1:4433 ssl;
    http2 on;
    server_name portal.example.org;
    access_log /var/log/nginx/access.log viara_portal;

    ssl_certificate     /etc/nginx/certs/portal.example.org.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/portal.example.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_PORTAL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:" always;

    client_max_body_size 50m;

    # --- Portal API: read/request only; never DICOMweb ---
    location /api/ {
        if ($viara_portal_api_allowed = 0) { return 404; }
        proxy_pass http://viara_portal_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        # Enable after including nginx/http-ratelimit.conf.example in http{}:
        # limit_req zone=viara_portal burst=30 nodelay;
    }

    # --- Portal realtime stream ---
    location /api/realtime/ {
        if ($viara_portal_api_allowed = 0) { return 404; }
        proxy_pass http://viara_portal_backend/api/realtime/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # --- Explicit denials: clinical viewer and admin surfaces are not public ---
    location /pacs-viewer/ { return 404; }
    location /pacs/        { return 404; }
    location /metrics      { return 404; }
    location /health/      { return 404; }
    location /.well-known/ { return 404; }   # only if your portal does not need ACME here
    location ~* /(admin|internal|debug|actuator|dicom-web|wado|orthanc)(/|$) { return 404; }

    # --- Portal SPA ---
    location / {
        proxy_pass http://viara_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# Rate-limit zones are declared in nginx/http-ratelimit.conf.example (http{}
# scope). Include it there, then uncomment the `limit_req zone=viara_portal`
# line inside the /api/ block.
# limit_req_zone $binary_remote_addr zone=viara_portal:10m rate=10r/s;
