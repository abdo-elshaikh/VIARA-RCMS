# VIARA Clinical Edge (Tier B) — staff + OHIF behind mTLS and Zero-Trust.
#
# Reachability: ONLY from WireGuard / Zero-Trust networks with a client
# certificate issued by the clinical CA. This file must never be exposed to the
# public internet on its own.
#
# Hard rules enforced here:
#   * ssl_verify_client on  -> devices without a client cert cannot connect
#   * OHIF served on the SAME origin as the staff app under /pacs-viewer/
#   * DICOM frame responses are streamed (proxy_buffering off)
#   * No admin/management path is proxied to the public (that is Tier A's job)
#
# Upstreams are the loopback-published VIARA services. Adjust if your packaging
# publishes them on different addresses.

upstream viara_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream viara_frontend {
    server 127.0.0.1:5173;
    keepalive 16;
}

upstream viara_ohif {
    server 127.0.0.1:3005;
    keepalive 16;
}

# Dedicated cache zone for DICOM thumbnails/previews only (never PHI-bearing
# metadata). Keep it small and off unless you have storage headroom.
# proxy_cache_path /var/cache/nginx/viara_pacs levels=1:2 keys_zone=viara_pacs:64m
#                  max_size=8g inactive=1h use_temp_path=off;

server {
    # Bind only to the WireGuard interface. Adjust to the actual private gateway.
    listen 10.20.0.1:80;
    server_name ris.example.org;
    access_log off;
    # Redirect any accidental HTTP to HTTPS, then require mTLS.
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` works on nginx 1.18+ (Ubuntu 22.04 etc.). On nginx
    # >= 1.25.1 you may instead write `listen 443 ssl;` + `http2 on;`.
    listen 10.20.0.1:443 ssl http2;
    server_name ris.example.org;
    # DICOMweb URLs can contain patient/study identifiers; rely on the
    # application audit trail instead of recording request targets in Nginx.
    access_log off;

    # --- Server certificate ---
    ssl_certificate     /etc/nginx/certs/ris.example.org.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/ris.example.org.key;

    # --- Mutual TLS: reject clients without a certificate from the clinical CA ---
    ssl_client_certificate /etc/nginx/clinical-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    # Optional CRL/OCSP for revoked devices:
    # ssl_crl /etc/nginx/clinical-ca.crl;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_VIARA:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Security headers ---
    # Frame-ancestors 'self' is set per-location for /pacs-viewer/ because the
    # staff app embeds OHIF; the global policy forbids framing.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Client body limits: match the backend PACS budget (200 MiB + overhead) ---
    client_max_body_size 250m;

    # Device identity for audit correlation. The backend trusts X-Forwarded-*
    # only from configured proxies; never trust these from the public internet.
    add_header X-Viara-Device-Serial $ssl_client_serial always;

    # --- DICOMweb / REST API ---
    location /api/ {
        proxy_pass http://viara_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
        proxy_set_header Connection "";
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        proxy_connect_timeout 30s;
    }

    # --- Live notifications (SSE): keep open and unbuffered ---
    location /api/realtime/ {
        proxy_pass http://viara_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
    }

    # --- OHIF diagnostic viewer, same origin as the staff app ---
    # The frontend build embeds this path via VITE_OHIF_URL=/pacs-viewer/.
    # OHIF runtime config derives routerBasename from window.location.pathname.
    location /pacs-viewer/ {
        proxy_pass http://viara_ohif;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Stream large WADO frame responses; never buffer whole studies in nginx.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        # Frame this viewer only from the staff origin. Because this location
        # declares add_header, it must re-declare the server-level security
        # headers (nginx does not inherit them once any add_header is present).
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Frame-Options "" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Viara-Device-Serial $ssl_client_serial always;
    }

    # --- Staff single-page application ---
    location / {
        proxy_pass http://viara_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 5m;
    }

    # --- Health/metrics: management network only ---
    location = /health/ready {
        allow 127.0.0.1;
        allow 10.20.0.0/24;   # clinical VPN subnet
        deny all;
        proxy_pass http://viara_backend/health/ready;
    }
    location /metrics {
        allow 127.0.0.1;
        allow 10.20.0.0/24;
        deny all;
        proxy_pass http://viara_backend;
        access_log off;
    }
}

# Rate limiting for /api/ is intentionally commented out above because
# `limit_req` requires a zone declared at http{} scope, and this file is dropped
# into conf.d/. Do the following instead:
#   1. copy nginx/http-ratelimit.conf.example into nginx.conf http{} (or a file
#      included there), and
#   2. uncomment the `limit_req zone=viara_api ...` line inside the /api/ block.
# ----------------------------------------------------------------
