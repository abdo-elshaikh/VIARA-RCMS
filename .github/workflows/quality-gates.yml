name: RCMS quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rcms-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: rcms_validation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rcms_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/rcms_validation
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BLIND_INDEX_KEY: ${{ secrets.BLIND_INDEX_KEY }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      CLIENT_URL: http://localhost:5173
      PORTAL_CLIENT_URL: http://localhost:5174
      PORTAL_PUBLIC_URL: http://localhost:5174
      VITE_OHIF_URL: http://localhost:3005
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      ORTHANC_PASSWORD: ${{ secrets.ORTHANC_PASSWORD }}
      PACS_WEBHOOK_SECRET: ${{ secrets.PACS_WEBHOOK_SECRET }}
      LOG_LEVEL: error

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            portal/package-lock.json

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application containers
        run: docker compose build --pull backend frontend portal ohif

      - name: Install Python and AI worker dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pacs/ai-worker/requirements*.txt

      - name: Test AI worker and compile Python sources
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip install -r pacs/ai-worker/requirements-dev.txt
          python -m pip_audit -r pacs/ai-worker/requirements.txt
          python -m pytest pacs/ai-worker/tests -q
          python -m compileall -q pacs/ai-worker/app pacs/ai-worker/tests

      - name: Scan backend image for high or critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          image-ref: rcms-backend:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image for high or critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          image-ref: rcms-frontend:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan portal image for high or critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          image-ref: rcms-portal:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install portal dependencies
        run: npm ci
        working-directory: portal

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high --prefix backend
          npm audit --omit=dev --audit-level=high --prefix frontend
          npm audit --omit=dev --audit-level=high --prefix portal

      - name: Run backend tests (no skips allowed)
        run: npm run test:ci
        working-directory: backend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test:ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Type-check portal
        run: npm run typecheck
        working-directory: portal

      - name: Build portal
        run: npm run build
        working-directory: portal

      - name: Apply fresh schema, migrations, and seeds
        run: node database/migrate.js --fresh --seed

      - name: Run live database-backed API validation
        run: npm run validate-deployment
        working-directory: backend
