name: RCMS quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rcms-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: rcms_validation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: validation_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rcms_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:validation_password@localhost:5432/rcms_validation
      POSTGRES_PASSWORD: validation_password
      JWT_SECRET: ci_only_validation_secret_0123456789_ABCDEFGHIJKLMNOPQRSTUVWXYZ
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      BACKUP_ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      BLIND_INDEX_KEY: 123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0
      CLIENT_URL: http://localhost:5173
      PORTAL_CLIENT_URL: http://localhost:5174
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      ORTHANC_PASSWORD: ci_only_orthanc_password
      PACS_WEBHOOK_SECRET: ci_only_webhook_secret_0123456789
      LOG_LEVEL: error

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            portal/package-lock.json

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install portal dependencies
        run: npm ci
        working-directory: portal

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high --prefix backend
          npm audit --omit=dev --audit-level=high --prefix frontend
          npm audit --omit=dev --audit-level=high --prefix portal

      - name: Run backend tests (no skips allowed)
        run: npm run test:ci
        working-directory: backend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test:ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Type-check portal
        run: npm run typecheck
        working-directory: portal

      - name: Build portal
        run: npm run build
        working-directory: portal

      - name: Apply fresh schema, migrations, and seeds
        run: node database/migrate.js --fresh --seed

      - name: Run live database-backed API validation
        run: npm run validate-deployment
        working-directory: backend
